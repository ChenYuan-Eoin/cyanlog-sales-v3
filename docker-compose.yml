version: '3.8'

services:
  # Local dependencies (minimal + pragmatic)
  #
  # Notes:
  # - This is NOT a full Supabase self-host stack (no PostgREST/Storage/Realtime).
  # - It provides a Postgres DB plus a GoTrue(Auth) API behind Kong at :54321.
  db:
    image: supabase/postgres:15.1.0.153
    container_name: cyanlog-db
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Supabase GoTrue (Auth)
  auth:
    image: supabase/gotrue:v2.145.0
    container_name: cyanlog-auth
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: your-jwt-secret-min-32-chars-long
      GOTRUE_JWT_EXP: 3600
    depends_on:
      db:
        condition: service_healthy

  # Supabase Kong (API Gateway)
  kong:
    image: supabase/kong:2.8.1
    container_name: cyanlog-kong
    restart: unless-stopped
    ports:
      - "54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
    volumes:
      - ./config/kong/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - auth
      - db

  # MinIO (文件存储)
  minio:
    image: minio/minio:latest
    container_name: cyanlog-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Redis (缓存/队列)
  redis:
    image: redis:7-alpine
    container_name: cyanlog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  default:
    name: cyanlog-network
