# ═══════════════════════════════════════════════════════════════
# 技术栈约束（强制遵循）
# ═══════════════════════════════════════════════════════════════
constraints:
  # 参考 ADR-006
  database:
    type: postgresql
    provider: supabase
    jsonb: required

  # 参考 ADR-008: 严禁使用 ORM
  data_access:
    orm: prohibited
    sdk: supabase-js
    type_generation: "supabase gen types typescript"

  # 参考 ADR-001
  ai_failover:
    chain: [local, cloud, rule-engine, manual-fallback]
    local_timeout_ms: 45000
    cloud_timeout_ms: 15000

  # 参考 ADR-004
  auth:
    type: supabase-auth
    rbac: required
    data_scope: org_id

  # 运行根唯一性（P1 已完成）
  code_root: product-truth/product-code
  deprecated_roots: []  # ✅ P1 已清理

