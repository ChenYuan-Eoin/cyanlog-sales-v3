name: Requirement Structure Checks
on:
  pull_request:
    paths:
      - 'product-truth/REQ_REGISTRY.yml'
      - 'product-truth/feature-packets/**'
      - 'product-truth/product-code/scripts/check-requirement-structure.*'
      - '.github/workflows/skills.yml'
  push:
    branches: [main, develop, 'codex/**']
permissions:
  contents: read
jobs:
  requirement-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check IDs, lifecycle states and declared Feature Packet paths
        run: node product-truth/product-code/scripts/check-requirement-structure.mjs
