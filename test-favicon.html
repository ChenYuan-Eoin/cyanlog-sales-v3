<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Favicon Test</title>
  <!-- 原始图片（扁的） -->
  <link rel="icon" href="https://wfawwhphfqqwfwrrkogy.supabase.co/storage/v1/object/public/workspace-assets/favicons/30000001-0000-0000-0000-000000000000_1781748187949.png" type="image/png">
</head>
<body>
  <h1>原始 Favicon（应该扁）</h1>
  <img src="https://wfawwhphfqqwfwrrkogy.supabase.co/storage/v1/object/public/workspace-assets/favicons/30000001-0000-0000-0000-000000000000_1781748187949.png" width="64" height="64" style="border: 1px solid red;">

  <h1>转换后 32x32 fill（应该方正）</h1>
  <img src="https://wfawwhphfqqwfwrrkogy.supabase.co/storage/v1/object/public/workspace-assets/favicons/30000001-0000-0000-0000-000000000000_1781748187949.png?w=32&h=32&resize=fill" width="64" height="64" style="border: 1px solid green;">

  <h1>转换后 32x32 cover（应该方正）</h1>
  <img src="https://wfawwhphfqqwfwrrkogy.supabase.co/storage/v1/object/public/workspace-assets/favicons/30000001-0000-0000-0000-000000000000_1781748187949.png?w=32&h=32&fit=cover" width="64" height="64" style="border: 1px solid blue;">

  <h1>转换后 32x32 crop（应该方正）</h1>
  <img src="https://wfawwhphfqqwfwrrkogy.supabase.co/storage/v1/object/public/workspace-assets/favicons/30000001-0000-0000-0000-000000000000_1781748187949.png?w=32&h=32&fit=crop" width="64" height="64" style="border: 1px solid orange;">
</body>
</html>
