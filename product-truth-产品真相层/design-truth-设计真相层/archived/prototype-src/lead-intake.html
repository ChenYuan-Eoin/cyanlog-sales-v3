<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyanlog | 客户接触</title>
    <link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
    <script src="./assets/layout.js"></script>
    <script>
        const content = `
            <div class="breadcrumbs"><span>用户旅程</span><span>/</span><span>客户接触</span></div>

            <section class="page-header">

                    <div class="eyebrow">Step 01</div>
                    <div class="page-title">客户接触录入</div>

                </div>
                <div class="header-actions">
                    <a class="btn" href="./home-dashboard.html">返回首页</a>
                    <a class="btn btn-primary" href="./opportunity-routing.html">保存并分流</a>
                </div>
            </section>

            <section class="capture-shell">
                <div class="card">
                    <div class="section-title">接触摘要</div>
                    <div class="detail-grid">
                        <div class="field-block"><label>客户名称</label><input class="input" value="华润万家有限公司"></div>
                        <div class="field-block"><label>接触来源</label><select class="select"><option>客户直接询价</option><option>招标公告</option><option>存量客户续约</option></select></div>
                        <div class="field-block"><label>联系人</label><input class="input" value="张经理"></div>
                        <div class="field-block"><label>联系方式</label><input class="input" value="138 0000 5566"></div>
                        <div class="field-block"><label>机会类型初判</label><select class="select"><option>报价型</option><option>标书型</option><option>合同补录型</option></select></div>
                        <div class="field-block"><label>预计金额</label><input class="input" value="1,610,000"></div>
                    </div>

                    <div class="field-block" style="margin-top:18px;">
                        <label>需求摘要</label>
                        <textarea class="textarea">客户需要云平台二期扩容方案，希望一周内给出商务报价，并要求同步评估交付周期及后续合同模板适配情况。</textarea>
                    </div>

                    <div style="margin-top:22px;" class="section-title">附件与上下文</div>

                        <div class="attachment-pill">客户需求清单.xlsx</div>

                    </div>
                </div>

                <div class="intake-aside">
                    <div class="score-card">
                        <div class="section-title">接触质量</div>
                        <div class="score-ring">84%</div>
                        <div class="score-meta">客户信息完整度高，需求明确度中等，建议 24 小时内完成机会分流。</div>
                        <div class="summary-list" style="margin-top:16px;">
                            <div class="summary-row"><span class="key">客户信息完整度</span><strong>84%</strong></div>
                            <div class="summary-row"><span class="key">是否有正式招标</span><strong>否</strong></div>
                            <div class="summary-row"><span class="key">是否同步合同诉求</span><strong>是</strong></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="section-title">系统建议</div>
                        <div class="list">
                            <div class="list-item-card"><div class="list-item-title">优先进入报价入口</div><div class="list-item-meta">当前更像客户直接询价，商务数字与交付条件是主问题。</div></div>

                        </div>
                    </div>
                </div>
            </section>
        `;

        document.body.innerHTML = pageShell({
            activeRail: "home",
            activePage: "lead-intake",
            topTitle: "客户接触",
            topMeta: "把外部输入标准化收口",
            topAction: '<a class="btn btn-primary" href="./opportunity-routing.html">进入机会分流</a>',
            content
        });
    </script>
</body>
</html>
