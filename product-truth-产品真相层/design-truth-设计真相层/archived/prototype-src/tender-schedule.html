<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyanlog | 日程引擎</title>
    <link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
    <script src="./assets/layout.js"></script>
    <script>
        const content = `
            <div class="breadcrumbs"><span>用户旅程</span><span>/</span><span>报价或标书</span><span>/</span><span>日程引擎</span></div>

            <section class="page-header">
                <div>
                    <div class="eyebrow">Step 04</div>
                    <div class="page-title">日程引擎</div>
                    <div class="page-description">时间工作面，负责倒排、提醒和同步。</div>
                </div>
                <div class="header-actions">
                    <a class="btn" href="./quote-center.html">来自报价</a>
                    <a class="btn" href="./tender-analysis.html">来自标书</a>
                    <a class="btn btn-primary" href="./calendar-overview.html">同步团队日程</a>
                </div>
            </section>

            <section class="schedule-apple">
                <div class="schedule-apple-top">
                    <div class="apple-card">
                        <div class="apple-calendar-title">
                            ${appIcon("i-calendar")}
                            <span>May</span>
                        </div>
                        <div class="apple-calendar-grid" style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:20px;">
                            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                        </div>
                        <div class="apple-calendar-grid">
                            <span class="muted">19</span><span class="muted">20</span><span class="muted">21</span><span class="muted">22</span><span class="today">23</span><span>24</span><span>25</span>
                        </div>
                    </div>

                    <div class="apple-card apple-date-card">
                        <strong>23</strong>
                        <span>Friday · 封标前一日</span>
                    </div>

                    <div class="apple-card apple-summary-card">
                        <h3>标书项目节点</h3>
                        <p>截止时间 2026-05-24 10:00。</p>
                        <div class="apple-node-list">
                            <div class="apple-node">
                                <div class="apple-node-time">10:30</div>
                                <div class="apple-node-copy"><strong>保证金确认</strong><span>财务节点。</span></div>
                            </div>
                            <div class="apple-node">
                                <div class="apple-node-time">14:00</div>
                                <div class="apple-node-copy"><strong>法务锁点</strong><span>锁章位与偏离表。</span></div>
                            </div>
                            <div class="apple-node">
                                <div class="apple-node-time">18:30</div>
                                <div class="apple-node-copy"><strong>封标前总校</strong><span>交叉检查。</span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="apple-board">
                    <div class="apple-board-head">
                        <div class="apple-board-title">
                            <strong>23</strong>
                            <div>
                                <div>Friday</div>
                                <div style="margin-top:4px;color:rgba(255,255,255,0.56);font-size:12px;">关键节点与提醒</div>
                            </div>
                        </div>
                        <div class="pill-row">
                            <span class="pill danger">截止前 16h</span>
                            <span class="pill">iPhone</span>
                            <span class="pill">系统日历</span>
                        </div>
                    </div>

                    <div class="apple-timeline">
                        <div>
                            <div class="apple-column-title">倒排节点</div>
                            <div class="apple-hour-row"><span>09:00</span><div class="apple-hour-line"></div></div>
                            <div class="apple-hour-row"><span>10:30</span><div class="apple-hour-line"></div><div class="apple-hour-event">保证金到账回执回传财务群</div></div>
                            <div class="apple-hour-row"><span>14:00</span><div class="apple-hour-line"></div><div class="apple-hour-event">法务确认偏离表与盖章页</div></div>
                            <div class="apple-hour-row"><span>18:30</span><div class="apple-hour-line"></div><div class="apple-hour-event">封标前总校，锁最终版本</div></div>
                            <div class="apple-hour-row"><span>21:00</span><div class="apple-hour-line"></div></div>
                        </div>

                        <div>
                            <div class="apple-column-title">同步提醒</div>
                            <div class="apple-hour-row"><span>08:45</span><div class="apple-hour-line"></div><div class="apple-hour-event">提醒销售确认送达路线与现场联系人</div></div>
                            <div class="apple-hour-row"><span>13:30</span><div class="apple-hour-line"></div><div class="apple-hour-event">向售前推送评分项补证清单</div></div>
                            <div class="apple-hour-row"><span>17:30</span><div class="apple-hour-line"></div><div class="apple-hour-event">移动端弹窗提示准备封包</div></div>
                            <div class="apple-hour-row"><span>06:30</span><div class="apple-hour-line"></div><div class="apple-hour-event">次日出发提醒，避开早高峰</div></div>
                            <div class="apple-hour-row"><span>09:20</span><div class="apple-hour-line"></div></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="schedule-rules" style="margin-top:18px;">
                <div class="schedule-rule-card">
                    <div class="section-title">存在明确截止日</div>
                    <div class="card-subtitle" style="margin-bottom:14px;">存在明确截止日时执行倒排。</div>
                    <div class="list">
                        <div class="list-item-card"><div class="list-item-title">T - 45d：合同签署</div><div class="list-item-meta">锁定付款节奏与交付边界。</div></div>
                        <div class="list-item-card"><div class="list-item-title">T - 12d：实施准备</div><div class="list-item-meta">资源、环境、预交付材料全部锁定。</div></div>
                    </div>
                </div>

                <div class="schedule-rule-card">
                    <div class="section-title">交付日未明确</div>
                    <div class="card-subtitle" style="margin-bottom:14px;">无明确日期时切换为提醒序列。</div>
                    <div class="list">
                        <div class="list-item-card"><div class="list-item-title">报价后 3 天</div><div class="list-item-meta">确认预算和采购窗口。</div></div>
                        <div class="list-item-card"><div class="list-item-title">报价后 14 天</div><div class="list-item-meta">判断继续推进还是关闭机会。</div></div>
                    </div>
                </div>

                <div class="schedule-rule-card">
                    <div class="section-title">提醒同步策略</div>
                    <div class="card-subtitle" style="margin-bottom:14px;">关键节点同步到日历与消息渠道。</div>
                    <div class="summary-list">
                        <div class="summary-row"><span class="key">同步渠道</span><strong>iPhone / 日历 / 飞书</strong></div>
                        <div class="summary-row"><span class="key">缓冲策略</span><strong>默认预留 20%</strong></div>
                        <div class="summary-row"><span class="key">更新时间</span><strong>字段变更即重算</strong></div>
                    </div>
                </div>
            </section>
        `;

        document.body.innerHTML = pageShell({
            activeRail: "calendar",
            activePage: "tender-schedule",
            topTitle: "日程引擎",
            topMeta: "倒排分支、提醒分支、节点同步",
            topAction: '<a class="btn btn-primary" href="./calendar-overview.html">同步团队日程</a>',
            content
        });
    </script>
</body>
</html>
