<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyanlog | 合同生成</title>
    <link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
    <script src="./assets/layout.js"></script>
    <script>
        const content = `
            <div class="breadcrumbs"><span>用户旅程</span><span>/</span><span>报价或分流</span><span>/</span><span>合同生成</span></div>

            <section class="page-header">
                <div>
                    <div class="eyebrow">Step 05</div>
                    <div class="page-title">合同生成工作台</div>
                    <div class="page-description">合同页负责条款组装、变量映射和正式文档预览。风险判断和整改建议放到合同审核页，不再把“做文档”和“审风险”塞在同一屏里。</div>
                </div>
                <div class="header-actions">
                    <a class="btn" href="./quote-center.html">返回报价</a>
                    <a class="btn btn-primary" href="./contract-review.html">进入合同审核</a>
                </div>
            </section>

            <section class="builder-shell">
                <div class="card">
                    <div class="section-title">条款模块</div>
                    <div class="module-list">
                        <div class="module-item"><h4>标准交付条款</h4><p>已关联交付日期、上线范围和验收节点。</p></div>
                        <div class="module-item"><h4>付款条款</h4><p>从报价单同步 30% 预付款 / 70% 验收款。</p></div>
                        <div class="module-item"><h4>知识产权条款</h4><p>定制成果归甲方，通用模块归乙方。</p></div>
                        <div class="module-item"><h4>违约责任条款</h4><p>当前采用标准责任上限，需要在审核页复核账期换条件。</p></div>
                    </div>

                    <div style="margin-top:20px;" class="section-title">变量映射</div>
                    <div class="token-cloud">
                        <span class="pill brand">#{客户全称}</span>
                        <span class="pill brand">#{合同总价}</span>
                        <span class="pill brand">#{交付日期}</span>
                        <span class="pill brand">#{付款节点}</span>
                        <span class="pill brand">#{项目范围}</span>
                    </div>
                </div>

                <div class="contract-stage">
                    <div class="contract-toolbar">
                        <div>
                            <div class="section-title" style="color:#fff;margin-bottom:4px;">合同预览</div>
                            <div class="section-caption" style="color:rgba(255,255,255,0.64);">技术服务协议_V4</div>
                        </div>
                        <div class="pill-row">
                            <span class="pill">Word</span>
                            <span class="pill">PDF</span>
                            <span class="pill warning">待审核</span>
                        </div>
                    </div>

                    <div class="doc-frame">
                        <h2>技术服务协议</h2>
                        <p><strong>甲方：</strong>华润万家有限公司</p>
                        <p><strong>乙方：</strong>Cyanlog Technology Co., Ltd.</p>
                        <p>本合同总金额为人民币壹佰陆拾壹万壹仟贰佰元整（¥1,611,200.00）。</p>
                        <p>甲方应在合同签署后 5 个工作日内支付首期款 30%，剩余款项在上线验收完成后支付。</p>
                        <p>乙方应按照双方确认的交付计划完成云平台二期扩容、实施服务及约定范围内的上线支持。</p>
                        <div class="insight-box">报价中的付款节点、金额、项目范围已同步至合同变量，不需要再次手工录入。</div>
                    </div>
                </div>
            </section>
        `;

        document.body.innerHTML = pageShell({
            activeRail: "contract",
            activePage: "contract-center",
            topTitle: "合同生成",
            topMeta: "条款组装、变量映射、正式预览",
            topAction: '<a class="btn btn-primary" href="./contract-review.html">提交审核</a>',
            content
        });
    </script>
</body>
</html>
