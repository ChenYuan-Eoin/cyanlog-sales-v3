<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Colors · Semantic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px; background: var(--bg-surface); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell { border-radius: 14px; padding: 14px; position: relative; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .cell strong { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
  .cell .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 4px; }
  .cell .pair { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }
  .cell .pair .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="label">Semantic palette (v3 original)</div>
  <div class="grid">
    <div class="cell" style="background:#dcfce7;color:#166534;">
      <div><strong>Success</strong><div class="hex">--success-700 / -100</div></div>
      <div class="pair"><span class="dot"></span>已完成 · 通过</div>
    </div>
    <div class="cell" style="background:#ffedd5;color:#92400e;">
      <div><strong>Warning</strong><div class="hex">--warning-700 / -100</div></div>
      <div class="pair"><span class="dot"></span>待补 · 临期</div>
    </div>
    <div class="cell" style="background:#fee2e2;color:#b91c1c;">
      <div><strong>Danger</strong><div class="hex">--danger-700 / -100</div></div>
      <div class="pair"><span class="dot"></span>逾期 · 驳回</div>
    </div>
    <div class="cell" style="background:#dbeafe;color:#1d4ed8;">
      <div><strong>Info</strong><div class="hex">--info-700 / -100</div></div>
      <div class="pair"><span class="dot"></span>提示 · 引用</div>
    </div>
  </div>
</body>
</html>
