<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Brand · Icon sprite (Lucide)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { padding: 20px; background: var(--bg-surface); }
  .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
  .source-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--accent-ink); background: var(--accent-soft); padding: 4px 8px; border-radius: 999px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--bg-muted); }
  .cell [data-lucide] { width: 20px; height: 20px; stroke: var(--fg-2); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-family: var(--font-mono); font-size: 8.5px; color: var(--fg-3); letter-spacing: 0; line-height: 1; }
</style>
</head>
<body>
  <div class="label-row">
    <div class="label">Iconography · rendered via Lucide CDN</div>
    <span class="source-tag">lucide@0.456 · stroke 1.6</span>
  </div>
  <div class="grid">
    <div class="cell"><i data-lucide="home"></i><div class="name">home</div></div>
    <div class="cell"><i data-lucide="log-in"></i><div class="name">log-in</div></div>
    <div class="cell"><i data-lucide="briefcase"></i><div class="name">briefcase</div></div>
    <div class="cell"><i data-lucide="file-plus"></i><div class="name">file-plus</div></div>
    <div class="cell"><i data-lucide="network"></i><div class="name">network</div></div>
    <div class="cell"><i data-lucide="receipt-text"></i><div class="name">receipt-text</div></div>
    <div class="cell"><i data-lucide="file-text"></i><div class="name">file-text</div></div>
    <div class="cell"><i data-lucide="file-signature"></i><div class="name">file-signature</div></div>
    <div class="cell"><i data-lucide="calendar"></i><div class="name">calendar</div></div>
    <div class="cell"><i data-lucide="clock"></i><div class="name">clock</div></div>
    <div class="cell"><i data-lucide="check-square"></i><div class="name">check-sq</div></div>
    <div class="cell"><i data-lucide="settings"></i><div class="name">settings</div></div>
    <div class="cell"><i data-lucide="search"></i><div class="name">search</div></div>
    <div class="cell"><i data-lucide="bell"></i><div class="name">bell</div></div>
    <div class="cell"><i data-lucide="user"></i><div class="name">user</div></div>
    <div class="cell"><i data-lucide="bar-chart-3"></i><div class="name">bar-chart</div></div>
    <div class="cell"><i data-lucide="layers"></i><div class="name">layers</div></div>
    <div class="cell"><i data-lucide="arrow-right"></i><div class="name">arrow-rt</div></div>
    <div class="cell"><i data-lucide="download"></i><div class="name">download</div></div>
    <div class="cell"><i data-lucide="check-circle-2"></i><div class="name">check-cir</div></div>
  </div>
  <script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
