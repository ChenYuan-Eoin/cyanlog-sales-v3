<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Spacing · Page rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px 20px; background: var(--bg-page); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }

  /* Mini schematic of a page */
  .stage {
    background: var(--bg-page);
    border: 1px dashed var(--border-3);
    border-radius: 12px;
    padding: 14px;
    position: relative;
  }
  .blk { background: #fff; border: 1px solid var(--border-1); border-radius: 8px; }
  .blk.dark { background: var(--ink-900); border-color: var(--ink-700); }
  .blk.row { height: 18px; }
  .blk.head { height: 30px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; background: transparent; border: none; }
  .blk.head .title { width: 80px; height: 14px; background: var(--fg-1); border-radius: 3px; }
  .blk.head .desc { flex: 1; height: 8px; background: var(--ink-200); border-radius: 3px; }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .strip .blk { height: 56px; }
  .body-row { display: grid; grid-template-columns: minmax(0,1.5fr) 0.7fr; gap: 8px; }
  .body-row .blk { height: 90px; }

  /* Spacing labels */
  .gap { position: relative; }
  .gap::before {
    content: attr(data-gap);
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 50%;
    margin-top: -7px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--accent);
    background: var(--bg-page);
    padding: 0 6px;
    font-weight: 600;
    z-index: 1;
  }
  .gap::after {
    content: "";
    position: absolute;
    left: 4px; right: 4px;
    top: 50%;
    height: 1px;
    background: var(--accent);
    opacity: 0.32;
  }
  .gap.g-36 { height: 36px; }
  .gap.g-24 { height: 24px; }
</style>
</head>
<body>
  <div class="label">Page rhythm · header → first section 36 px · between sections 24 px</div>

  <div class="stage">
    <div class="blk head">
      <div class="title"></div>
      <div class="desc"></div>
    </div>
    <div class="blk row" style="margin-top:6px;background:var(--ink-150);border:none;width:60%;"></div>

    <div class="gap g-36" data-gap="36 px ↕"></div>

    <div class="strip">
      <div class="blk"></div><div class="blk"></div><div class="blk"></div><div class="blk"></div>
    </div>

    <div class="gap g-24" data-gap="24 px"></div>

    <div class="body-row">
      <div class="blk dark"></div>
      <div class="blk"></div>
    </div>

    <div class="gap g-24" data-gap="24 px"></div>

    <div class="body-row">
      <div class="blk"></div>
      <div class="blk"></div>
    </div>
  </div>
</body>
</html>
