<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Shadows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 100%; height: 82px; background: var(--bg-surface); border-radius: 14px; border: 1px solid var(--border-1); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); font-weight: 600; }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); font-weight: 600; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="label">Elevation · single soft ramp · neutral ink</div>
  <div class="grid">
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-1);">resting</div><div class="name">shadow-1</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-2);">hover</div><div class="name">shadow-2</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-3);">panel</div><div class="name">shadow-3</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-4);">modal</div><div class="name">shadow-4</div></div>
  </div>
</body>
</html>
