<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Radii scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px; background: var(--bg-surface); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 100%; aspect-ratio: 1 / 1; background: var(--accent-soft); border: 1.5px solid var(--accent); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="label">Radius · default 10px for controls, 16px for cards</div>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:4px;"></div><div class="name">radius-xs</div><div class="px">4 px</div></div>
    <div class="cell"><div class="box" style="border-radius:8px;"></div><div class="name">radius-sm</div><div class="px">8 px</div></div>
    <div class="cell"><div class="box" style="border-radius:10px;"></div><div class="name">radius-md ★</div><div class="px">10 px</div></div>
    <div class="cell"><div class="box" style="border-radius:16px;"></div><div class="name">radius-lg ★</div><div class="px">16 px</div></div>
    <div class="cell"><div class="box" style="border-radius:24px;"></div><div class="name">radius-xl</div><div class="px">24 px</div></div>
    <div class="cell"><div class="box" style="border-radius:999px;"></div><div class="name">pill</div><div class="px">∞</div></div>
  </div>
</body>
</html>
