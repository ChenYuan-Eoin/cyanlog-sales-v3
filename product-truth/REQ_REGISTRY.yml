          change: 软提醒 → 硬关单（422 PENDING_ASKS_BLOCK）
      design_decisions_v2:
        - 一次回答（移除 PARTIAL/INSUFFICIENT/VERIFIED 状态）
        - 必填（硬关单，422 拒绝）
        - 上传人触发+澄清人入报（报告显式含 ASK 列表+姓名+角色+时间）
        - 0 风险说明（no_ask_reason 字段）
        - rolling 版本（report_versions 表，响应即升版）
      downstream_impact:
        - F007: 报告生成消费侧适配 (新 askContext 参数 + 升版触发)
        - F005 analyze: 审核完成后自动调 generate
        - F005 page: 新增"ASK 清单"标签页 + 报告版本入口

