      当前边界：不属于合同审核主链路，只作为 F014 标书 OCR 解析复用的共享/历史 OCR 能力。
      合同审核第一阶段以合同文件版本、SkillBundle、RiskFinding 和 Word 批注为主，不依赖 F008。

