# REQ_REGISTRY
# 统一的需求注册表
# 格式: YAML
# 维护规则:
#   - REQ ID 一旦分配，不可变更
#   - 状态变更: draft → confirmed → design_confirmed → in_progress → completed
#   - design_confirmed: 设计已确认，等待开发（冻结设计方案）
#   - 代码位置由 AI 在开发时回填
#   - 代码中的 REQ 标记必须与之一致

version: "2026-07-20.1"
last_updated: "2026-07-20T17:20:13+08:00"

goal_governance:
  status: active
  namespace_version: "2026-07-20.1"
  portfolio_goals_source: audit_supplement.objective_tree.child_goals
  portfolio_umbrella_legacy_alias: "audit_supplement.objective_tree.primary_goal.id=G0；已退役，不属于正式可验收 G1-G11"
  rules:
    - "G 是不可变的长期产品组合目标；正式可验收编号只使用 G1-G11，不直接作为 execution_queue.active。"
    - "WP 是可排序、可独立验收的开发工作包；ID 只使用 WP00-WP09，名称与 slug 单独存放。"
    - "F 是 Feature Packet，IN 是需求输入，DG 是历史批次交付门禁，HG 是 Harness 执行门禁；不得复用为产品目标。"
    - "WP 完成不等于 G 完成；G 只有在相关 WP 和自身验收证据均有效时才能关闭。"
    - "完成证据必须绑定 namespace_version、WP、Git SHA、部署/数据库环境及浏览器或真实文件产物。"
  work_package_crosswalk:
    WP00: {name: 目标基线整合, primary_goals: [G1, G10, G11], state: completed_goal_baseline_commit_18dad230}
    WP01: {name: 平台模型接入与应用底座, primary_goals: [G4], supporting_goals: [G3, G7], state: active_reacceptance}
    WP02: {name: AI 运行真实性与路由证据, primary_goals: [G3], supporting_goals: [G7, G10], state: next_needs_current_runtime_proof}
    WP03: {name: 合同规则集合产品化, primary_goals: [G3, G4], supporting_goals: [G7, G10], state: acceptance_disputed}
    WP04: {name: 合同中心入口与任务身份, primary_goals: [G6], supporting_goals: [G8], state: needs_reacceptance}
    WP05: {name: Word/PDF 风险处理与循环复审, primary_goals: [G2], supporting_goals: [G3, G6, G8, G10], state: parked_waiting_external_gold_and_product_reacceptance}
    WP06: {name: 文档对比, primary_goals: [G6], supporting_goals: [G7, G8, G10], state: completed_preview_candidate_not_production}
    WP07: {name: 合同起草, primary_goals: [G6], supporting_goals: [G2, G8, G10], state: queued}
    WP08: {name: 横切体验伞, primary_goals: [G5, G8], state: must_split_before_activation}
    WP09: {name: 工程与发布验收, primary_goals: [G7, G8, G9, G10, G11], state: queued}
  legacy_aliases:
    - "2026-07-10 至 2026-07-18 的执行账本旧 G1-G9，依次解释为 WP01-WP09。"
    - "F027 0.0.1 的批次卡旧 G0-G7，依次解释为 DG0-DG7。"
