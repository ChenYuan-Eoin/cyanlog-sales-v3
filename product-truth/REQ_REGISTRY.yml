        - "WP01：旧 AI_CONFIG / ModelPolicy 仅保留历史只读与回滚追溯，不再被正式业务运行消费；新图不与旧图混合，候选可安全回滚而不丢失历史引用。"
        - "WP02：五个注册业务用点均从已发布 BusinessUsePoint 编译唯一运行计划；真实 route 调用、pinned 调试、降级尝试、token、model_invocations 和 ReviewRun 身份可审计，配置中心不得把 probe 或 pinned 证据冒充当前路由健康。"
        - "WP09：运行计划必须按 executionEnvironment 投影；Hosted 排除 local Provider 后重新连续编号，环境排除不生成 invocation、不算失败降级；快照同时保留 configured route 与 effective route。"
        - "WP09：配置页面按业务可理解顺序显示模型能力、产品功能选择的 AI 能力、管理员配置顺序及本机/托管实际执行顺序，机器字段只作为次级审计信息。"
      downstream_release_gates:
        - "WP03（不回退 WP02 完成态）：修复无效发布规则资产，使真实 ReviewRun 能同时绑定有效规则快照与已解析路由快照；规则执行质量和独立金标仍不得由模型运行证据替代。"
        - "WP09（Active，不回退 WP01/WP02 完成态）：先验收 Hosted 路由与同一 release commit 的 Preview 真实运行；Production 前仍须验收数据库原子发布、RLS 与正式发布。"

