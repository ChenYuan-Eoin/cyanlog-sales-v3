audit_supplement:
  source: "2026-06-30 用户线上截图与项目整体审查"
  purpose: >
    将既有 F0xx 需求清单补成可验收的需求治理索引。
    本注册表不替代 Feature Packet；它负责说明每个需求当前归属、实现证据、
    验收缺口和跨域问题映射。
  registry_rules:
    - 需求按产品愿景和模块边界归集，不按 Bug 标题机械合并。
    - 功能状态不能只看是否有代码；必须同时看设计、实现、测试、浏览器验收和线上证据。
    - 配置中心是控制面，合同/报价/审批等业务模块是执行面，不能互相写穿。
    - 错误态、权限失败、组织上下文失败不能被前端渲染成真实空数据。
    - 临时排查文档、截图、trace 和历史资产必须有归档/复用/删除结论，不得成为新的长期 truth。
  objective_tree:
    primary_goal:
      id: G0
      name: 商业产品第一阶段闭环恢复
      description: >
        把 ONES Sales 从功能堆叠和临时修补恢复为可持续迭代的商业产品第一阶段。
        第一阶段不追求终版大而全，但合同审核、配置中心、组织权限、规则/Skill、
        数据/API、前端体验、性能发布必须按同一套需求来源、设计约束和验收证据闭环。
      doc_policy: "文档补全是问题域支撑动作，不作为独立主目标；补文档必须能指导代码、测试、浏览器和线上验收。"
      merge_policy: "Bug 合并按同一根因、同一对象、同一接口/状态机、同一验收证据判断，不按标题相似度机械合并。"
    child_goals:
      G1:
        name: 需求与问题资产治理
        problem_domains: [PD01, PD09, PD10]
        related_reqs: [F027]
        acceptance: "每个 P0/P1 问题都有 REQ、Bug ID、证据、修复批次、验收标准和收尾结论。"
      G2:
        name: 合同审核产品闭环
        problem_domains: [PD04, PD05, PD07]
        related_reqs: [F005v2, F005, F007]
        acceptance: "真实合同能走通上传/解析、ReviewRun、RiskFinding、谈判、Word 批注、报告归档的第一阶段闭环。"
      G3:
        name: 审核规则与 Skill 闭环
        problem_domains: [PD03, PD06]
        related_reqs: [F006, F009, F012]
        acceptance: "ReviewRun 绑定 RuleSnapshot、SkillBundle 和不可漂移的已解析路由快照，规则或平台路由变更不影响历史结果；历史 ModelPolicy 绑定保留。"
      G4:
        name: 配置中心数据底座
        problem_domains: [PD02, PD03, PD08]
        related_reqs: [F000, F009, F011, F012]
        acceptance: "生产数据存在时不显示 0；401/403/500/未配置/未发布都有清晰错误态。"
      G5:
        name: 组织权限与外部同步
        problem_domains: [PD02, PD08]
        related_reqs: [F003, F011]
        acceptance: "超管、管理员、普通用户视角验收通过；新增/删除/分配后组织页和角色页同步刷新。"
      G6:
        name: 合同中心信息架构
        problem_domains: [PD04, PD05]
        related_reqs: [F005v2, F005]
        acceptance: "起草、上传、风险审核、文档比对四个入口在不同合同状态下均有明确页面和阻断提示。"
      G7:
        name: API 与数据一致性
        problem_domains: [PD02, PD03, PD06, PD09]
        related_reqs: [F003, F005, F009, F011, F012, F027]
        acceptance: "错误不被吞为空数据；坏请求返回可预期 400；关键 API 有测试和线上样本。"
      G8:
        name: 前端体验与响应式
        problem_domains: [PD04, PD09]
        related_reqs: [F005v2, F027]
        acceptance: "真实浏览器覆盖桌面、iPad、手机；无遮挡、横向溢出、不可点击和错误边界。"
      G9:
        name: 性能与稳定性
        problem_domains: [PD09, PD10]
        related_reqs: [F021, F027]
        acceptance: "trace、Server-Timing、build size、线上样本能证明主要瓶颈和修复收益。"
      G10:
        name: 发布与验收治理
        problem_domains: [PD09, PD10]
        related_reqs: [F027]
        acceptance: "lint、typecheck、test、build、浏览器、移动端、Vercel Ready/Production 证据齐全。"
      G11:
        name: 文档与噪音治理
        problem_domains: [PD01, PD10]
        related_reqs: [F021, F027]
        acceptance: "不新增平行噪音；删除前有结论和确认；保留内容能被主文档或 F0xx 引用。"
  active_problem_domains:
    PD01:
      name: 需求治理与追踪断层
      related_reqs: [F027, F000, F005v2]
      requirement_gap: "缺少从产品愿景、模块目标、F0xx、代码、测试、线上证据到 Bug 的强绑定。"
    PD02:
      name: 身份、组织上下文与假空态
      related_reqs: [F003, F011, F027]
      requirement_gap: "生产库存在数据时，前端不得因 401/403/ORG_CONTEXT 失败显示 0 或 seed 提示。"
    PD03:
      name: 配置中心控制面失真
      related_reqs: [F000, F009, F010, F011, F012]
      requirement_gap: "主题、品牌、规则、角色、组织等配置必须区分真实空、未授权、加载失败和未发布。"
    PD04:
      name: 合同中心入口语义混乱
      related_reqs: [F005v2, F005, F007]
      requirement_gap: "上传合同、风险审核、文档比对不能退化到同一个页面或同一种空态。"
    PD05:
      name: 合同审核商业产品对象未闭环
      related_reqs: [F005v2, F005, F006, F007, F009, F012]
      requirement_gap: "ReviewRun、RiskFinding、NegotiationTask、CustomerFeedback、CommentPatch 等对象不能只停留在 UI 文案或合成字段。"
    PD06:
      name: 规则、Skill、模型调用链未固化
      related_reqs: [F006, F009, F012]
      requirement_gap: "审核依据必须来自配置中心发布规则和 SkillBundle，不得由通用 prompt 或硬编码规则替代。"
    PD07:
      name: Word 批注与报告输出未形成验收闭环
      related_reqs: [F007, F005]
      requirement_gap: "批注为主、报告为辅必须可下载、可追溯、可降级说明，并绑定同一 RiskFinding。"
    PD08:
      name: 外部组织同步边界不清
      related_reqs: [F011, F003]
      requirement_gap: "飞书同步必须区分未配置、无权限、上游失败、MVP 仅同步部门等状态。"
    PD09:
      name: 真实验收门禁不足
      related_reqs: [F027]
      requirement_gap: "完成定义必须包含 build/test/lint、真实浏览器、移动端、线上部署和角色矩阵。"
    PD10:
      name: 噪音、外部依赖与非代码产物治理
      related_reqs: [F027, F021]
      requirement_gap: "本地依赖、构建产物、output 证据、历史文档必须区分 ignored、tracked、Vercel 上传和可复用资产。"

requirements:
  # ═══════════════════════════════════════════════════════════════
  # 配置中心共享架构 (Config Center Shared Architecture)
  # ═══════════════════════════════════════════════════════════════
  F000:
    name: 配置中心共享架构
    module: 配置中心
    source: PROJECT-主文档.md#6.0-6.4
    status: in_progress
    priority: P0
    feature_packet: product-truth/feature-packets/F000-config-center-architecture.md
    code_locations:
      - app/configs/page.tsx
      - lib/configs/types.ts
      - lib/configs/runtime.ts
    description: >
      配置中心的共享架构真相，不是独立业务页面。
      约束 F001/F009/F010/F011/F012 的配置拥有权、版本发布、生效回滚和消费边界，
      防止配置中心退化为若干无领域边界的 Tab CRUD。
    audit_supplement:
      current_gap: "线上截图显示多个配置域被渲染成 0，说明实现仍需按 F000 明确控制面、执行面、错误态和空态边界。"
      acceptance_requirements:
        - "配置中心每个能力域必须能说明谁可写、谁消费、发布版本是什么、失败时如何呈现。"
        - "业务页面只消费已发布配置，不直接修改配置事实。"
        - "未授权、组织上下文失败、接口错误不得展示为真实空配置。"

  # ═══════════════════════════════════════════════════════════════
  # 报价中心 (Quotes Center)
  # ═══════════════════════════════════════════════════════════════
  F001:
    name: 价盘与阶梯价
    module: 配置中心
