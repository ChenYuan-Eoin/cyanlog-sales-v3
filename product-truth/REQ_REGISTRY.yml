      - supabase/migrations/20260718062000_fix_word_source_text_repair_page_range.sql
      - supabase/migrations/20260718063000_calibrate_deterministic_preview_candidate_runtime.sql
      - supabase/migrations/20260718064000_fix_preview_runtime_calibration_bundle_clone.sql
      - supabase/migrations/20260718065000_add_atomic_fact_chunk_checkpoints.sql
      - supabase/migrations/20260718066000_harden_fact_checkpoint_source_anchors.sql
      - supabase/migrations/20260718067000_align_fact_transport_normalization.sql
      - supabase/migrations/20260718068000_align_empty_matched_level_validation.sql
      - supabase/migrations/20260718069000_fix_empty_matched_level_coalesce.sql
    description: |
      提审批注闭环（当前真相以 F005v2 §1.3/§1.4 与 F099 v2026-07-18.25 为准）：
      - 支持 DOC/DOCX/DOCM 与文本/扫描 PDF；独立图片不在本期
      - 统一 text/region/point 锚点；扫描 PDF 的 OCR 失败不阻断人工批注
      - DOCX/DOCM 直接在浏览器中渲染原 OOXML，尽可能保持页式布局并显示源文件已有修订与批注；服务器不得同步依赖 Office/LibreOffice
      - DOCX/DOCM 在不可变源文件副本上保留既有修订/批注并新增 Word 原生 AI 批注；DOCM 宏不执行且必须保持
      - DOC 保留原件但不承诺浏览器高还原预览；进入 AI 原生批注链前要求用户另存为 DOCX，不静默转换
      - DOCM 必须通过 ZIP 歧义/资源、全量 OPC part/Content-Type/relationship、w:document、真实 OLE 与静态 MS-OVBA 模块解析门禁；检查器不可用时 fail closed
      - legacy DOC 同格式原型和对象红灯仅作历史决策证据，不在 Production 路由或 WP05 退出条件中
      - PDF 从源 PDF 副本写入标准 annotation；预览 rendition 不得反向生成交付文件
      - ReviewRun 冻结唯一规则包和快照；历史决策不得改用当前规则解释
      - facts_v1 只接收逐字证据和类型化事实；等级、缺失语义、风险物化与 ReviewRun 完成由冻结规则和确定性服务端链裁决
      - chunk checkpoint 必须原子绑定 invocation、token、source/chunk hash、完整 coverage 和已验证 source anchor；确定性 schema/enum 错误不得进入任务级重试
      - 受控 canary 只能证明运行证据链；真实合同运行失败或没有独立盲测金标时，不得声明准确率通过或候选可发布
      - 逐字 source_quote 只有在全文唯一，或由已完成的冻结分块调用以 UTF-16 区间、分块 SHA 与源 SHA 唯一定位时，才可形成精确锚点；未执行冻结快照的规则线索保持 unbound
      - 单项保存与批量提交首先串行同一 contract/page；启动恢复只认 exact request id
      - 不依赖 CSPP、WPS WebOffice、OnlyOffice 或实时协同编辑

