<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cyanlog · UI Kit Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="./shell.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; }
  #root { min-height: 100vh; }

  /* Floating mini scene-switcher — sits on top of every screen so you can hop between them */
  .scene-switcher {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(12, 16, 24, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,0.4);
  }
  .scene-switcher button {
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
    letter-spacing: 0;
    font-family: var(--font-sans);
  }
  .scene-switcher button:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .scene-switcher button.active { color: #fff; background: var(--accent); }
  .scene-switcher .sep { width: 1px; height: 16px; background: rgba(255,255,255,0.12); margin: 0 4px; }
  .scene-switcher .label { padding: 0 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.42); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="./components.jsx"></script>
<script type="text/babel" src="./screen-login.jsx"></script>
<script type="text/babel" src="./screen-home.jsx"></script>
<script type="text/babel" src="./screen-quote.jsx"></script>
<script type="text/babel" src="./screen-approval.jsx"></script>

<script type="text/babel">
function SceneSwitcher({ scene, setScene }) {
  return (
    <div className="scene-switcher" data-screen-label="scene-switcher">
      <span className="label">Cyanlog</span>
      <span className="sep"></span>
      <button className={scene === "login" ? "active" : ""} onClick={() => setScene("login")}>登录</button>
      <button className={scene === "home" ? "active" : ""} onClick={() => setScene("home")}>首页</button>
      <button className={scene === "quote" ? "active" : ""} onClick={() => setScene("quote")}>报价</button>
      <button className={scene === "approval" ? "active" : ""} onClick={() => setScene("approval")}>审批</button>
    </div>
  );
}

function App() {
  // scene: which top-level screen is shown
  // activeSidebar: which sidebar item is highlighted within shell screens
  const [scene, setScene] = React.useState("login");
  const [activeSidebar, setActiveSidebar] = React.useState("home");

  const handleNav = (route, sidebarKey) => {
    if (route === "quote") { setScene("quote"); setActiveSidebar(sidebarKey || "quote"); }
    else if (route === "approval") { setScene("approval"); setActiveSidebar(sidebarKey || "approval"); }
    else { setScene("home"); setActiveSidebar(sidebarKey || "home"); }
  };

  // Screen rendering
  let body;
  if (scene === "login") {
    body = <ScreenLogin onLogin={() => { setScene("home"); setActiveSidebar("home"); }} />;
  } else {
    const railMap = {
      home:     { rail: "home",     title: "首页",     meta: "团队态势、推进节点、入口切换" },
      quote:    { rail: "quote",    title: "报价中心", meta: "测算 + 正式稿 · 14 单在推进" },
      approval: { rail: "approval", title: "审批中心", meta: "4 件待办 · 平均停留 5h 28m" },
    };
    const cfg = railMap[scene];
    const screenEl =
      scene === "home"     ? <ScreenHome onNav={handleNav} /> :
      scene === "quote"    ? <ScreenQuote /> :
      scene === "approval" ? <ScreenApproval /> : null;

    body = (
      <Shell
        activeRail={cfg.rail}
        activePage={activeSidebar}
        topTitle={cfg.title}
        topMeta={cfg.meta}
        topAction={null}
        onNav={handleNav}
      >
        <div data-screen-label={"screen-" + scene}>{screenEl}</div>
      </Shell>
    );
  }

  return (
    <>
      {body}
      <SceneSwitcher scene={scene} setScene={setScene} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
