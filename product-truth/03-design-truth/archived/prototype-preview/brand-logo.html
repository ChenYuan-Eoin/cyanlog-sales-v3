<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Brand · Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-surface); }
  .row { display: flex; align-items: center; gap: 18px; }
  .demo { display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-radius: 18px; }
  .mark { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
  .word strong { display: block; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .word span { display: block; font-size: 11px; letter-spacing: 0.06em; margin-top: 2px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="label">Brand mark · CY in 14 px square</div>
  <div class="row">
    <div class="demo" style="background:#fff;border:1px solid var(--border-1);">
      <div class="mark" style="background:linear-gradient(135deg,#19a8be 0%,#0e7387 100%);color:#fff;">CY</div>
      <div class="word" style="color:var(--fg-1);"><strong>Cyanlog</strong><span style="color:var(--fg-3);">企业销售支撑平台</span></div>
    </div>
    <div class="demo" style="background:#0b1220;">
      <div class="mark" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;">CY</div>
      <div class="word" style="color:#fff;"><strong>Cyanlog</strong><span style="color:rgba(255,255,255,0.6);">企业工作空间</span></div>
    </div>
  </div>
</body>
</html>
