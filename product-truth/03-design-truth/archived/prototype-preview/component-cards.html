<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Components · Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { padding: 22px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
</style>
</head>
<body>
  <div class="grid">
    <!-- Metric card -->
    <div class="card">
      <div class="card-head">
        <div class="stat-label">活跃机会</div>
        <span class="pill brand no-dot">总览</span>
      </div>
      <div class="stat-value">27</div>
      <div class="delta delta-up" style="margin-top:6px;">+6 较上周</div>
    </div>

    <!-- Module entry card -->
    <div class="card">
      <div class="card-head">
        <div class="icon-chip brand"><svg class="i i-lg"><use href="../assets/icons.svg#i-quote"/></svg></div>
        <span class="pill brand no-dot">报价工作台</span>
      </div>
      <h3 class="card-title">输入与正式稿并排</h3>
      <p class="caption" style="margin-top:6px;">左侧测算，右侧维护正式报价。</p>
    </div>

    <!-- List card -->
    <div class="card">
      <div class="card-head" style="margin-bottom:8px;">
        <div class="stat-label">今日提醒</div>
        <span class="pill warning no-dot">11</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border-1);font-size:13px;"><span style="color:var(--fg-3);">待补客户信息</span><strong>3 条</strong></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;"><span style="color:var(--fg-3);">待锁定节点</span><strong>4 个</strong></div>
    </div>
  </div>
</body>
</html>
