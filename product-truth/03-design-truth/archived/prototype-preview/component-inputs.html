<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Components · Inputs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { padding: 22px; background: var(--bg-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="field">
      <label class="field-label">企业邮箱</label>
      <input class="input" type="email" value="zhang.ym@cyanlog.com">
    </div>
    <div class="field">
      <label class="field-label">工作空间</label>
      <input class="input" value="华东销售作战空间">
    </div>
    <div class="field">
      <label class="field-label">客户名称</label>
      <input class="input" placeholder="搜索或新建客户">
    </div>
    <div class="field">
      <label class="field-label">报价金额</label>
      <input class="input" value="3,210万" style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;">
      <div class="field-hint">单位：人民币 元</div>
    </div>
  </div>
</body>
</html>
