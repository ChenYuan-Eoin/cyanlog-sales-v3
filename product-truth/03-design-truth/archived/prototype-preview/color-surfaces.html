<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Colors · Surface tokens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .cell { border-radius: 12px; padding: 12px 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-2); }
  .cell strong { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
  .cell .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.65; }
  .cell.dark { color: rgba(255,255,255,0.95); border-color: transparent; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="label">Surface tokens — semantic backgrounds</div>
  <div class="grid">
    <div class="cell" style="background:#eef3f8;"><strong>--bg-page</strong><div class="hex">#EEF3F8 · working stage</div></div>
    <div class="cell" style="background:#ffffff;"><strong>--bg-surface</strong><div class="hex">#FFFFFF · cards</div></div>
    <div class="cell" style="background:#f8fafc;"><strong>--bg-muted</strong><div class="hex">#F8FAFC · subtle</div></div>
    <div class="cell" style="background:#f1f5f9;"><strong>--bg-sunken</strong><div class="hex">#F1F5F9 · inputs off</div></div>
    <div class="cell dark" style="background:#0b1220;"><strong>--bg-shell</strong><div class="hex" style="color:rgba(255,255,255,0.65);">#0B1220 · navigation</div></div>
  </div>
</body>
</html>
