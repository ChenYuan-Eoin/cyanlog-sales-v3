<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyanlog | 团队日程</title>
    <link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
    <script src="./assets/layout.js"></script>
    <script>
        const content = `
            <div class="breadcrumbs"><span>用户旅程</span><span>/</span><span>日程引擎</span><span>/</span><span>团队日程</span></div>

            <section class="page-header">
                <div>
                    <div class="eyebrow">Step 07</div>
                    <div class="page-title">团队日程总览</div>
                    <div class="page-description">管理者在这里看的是节点密度、资源冲突和潜在逾期，不再回到具体单据里逐个翻。执行层和管理层的视角从这里分开。</div>
                </div>
                <div class="header-actions">
                    <a class="btn" href="./tender-schedule.html">返回日程引擎</a>
                    <a class="btn btn-primary" href="./approval-center.html">查看待审批节点</a>
                </div>
            </section>

            <section class="metric-strip">
                <div class="metric-card"><div class="metric-note">本周关键节点</div><div class="metric-inline"><strong>11</strong><span class="delta-neutral">含 3 个硬节点</span></div></div>
                <div class="metric-card"><div class="metric-note">资源冲突项目</div><div class="metric-inline"><strong>4</strong><span class="delta-down">售前资源紧张</span></div></div>
                <div class="metric-card"><div class="metric-note">逾期风险</div><div class="metric-inline"><strong>2</strong><span class="delta-down">需今日干预</span></div></div>
                <div class="metric-card"><div class="metric-note">已同步提醒</div><div class="metric-inline"><strong>28</strong><span class="delta-up">全部送达</span></div></div>
            </section>

            <section class="calendar-shell">
                <div class="card">
                    <div class="section-title">团队周历</div>
                    <div class="calendar-grid">
                        <div class="calendar-day"><div class="num">Mon 12</div><div class="event">报价终稿确认</div></div>
                        <div class="calendar-day"><div class="num">Tue 13</div><div class="event success">客户商务回访</div></div>
                        <div class="calendar-day"><div class="num">Wed 14</div><div class="event warning">法务内审锁定</div></div>
                        <div class="calendar-day"><div class="num">Thu 15</div><div class="event">技术澄清会</div></div>
                        <div class="calendar-day"><div class="num">Fri 16</div><div class="event warning">封标盖章完毕</div></div>
                        <div class="calendar-day"><div class="num">Sat 17</div><div class="event success">客户演示排练</div></div>
                        <div class="calendar-day"><div class="num">Sun 18</div></div>
                    </div>
                </div>

                <div class="panel-stack">
                    <div class="card">
                        <div class="section-title">团队负载</div>
                        <div class="load-row"><span>售前顾问</span><strong>86%</strong></div>
                        <div class="load-row"><span>法务</span><strong>78%</strong></div>
                        <div class="load-row"><span>销售运营</span><strong>64%</strong></div>
                        <div class="load-row"><span>财务</span><strong>52%</strong></div>
                    </div>
                    <div class="card">
                        <div class="section-title">管理动作</div>
                        <div class="list">
                            <div class="list-item-card"><div class="list-item-title">一键催办关键节点</div><div class="list-item-meta">向负责人与上级同步推送提醒。</div></div>
                            <div class="list-item-card"><div class="list-item-title">调整售前资源</div><div class="list-item-meta">把王蕾从低优先级项目切到医疗标项目。</div></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="split">
                <div class="card">
                    <div class="section-title">高风险项目</div>
                    <table class="table">
                        <thead><tr><th>项目</th><th>风险</th><th>建议</th></tr></thead>
                        <tbody>
                            <tr><td>医疗云平台标书</td><td>交付周期偏紧</td><td>压缩内部评审链路</td></tr>
                            <tr><td>零售续约合同</td><td>法务堵点</td><td>提前补充责任上限条款</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="card">
                    <div class="section-title">提醒渠道</div>
                    <div class="summary-list">
                        <div class="summary-row"><span class="key">移动端</span><strong>系统日历 / 手机闹钟</strong></div>
                        <div class="summary-row"><span class="key">协同工具</span><strong>飞书 / 企业微信</strong></div>
                        <div class="summary-row"><span class="key">邮件</span><strong>关键节点日报</strong></div>
                    </div>
                </div>
            </section>
        `;

        document.body.innerHTML = pageShell({
            activeRail: "calendar",
            activePage: "calendar-overview",
            topTitle: "团队日程",
            topMeta: "节点密度、资源冲突、逾期风险",
            topAction: '<a class="btn btn-primary" href="./approval-center.html">打开审批待办</a>',
            content
        });
    </script>
</body>
</html>
