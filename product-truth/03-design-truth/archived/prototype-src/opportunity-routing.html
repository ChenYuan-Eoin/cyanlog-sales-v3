<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyanlog | 机会分流</title>
    <link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
    <script src="./assets/layout.js"></script>
    <script>
        const content = `
            <div class="breadcrumbs"><span>用户旅程</span><span>/</span><span>客户接触</span><span>/</span><span>机会分流</span></div>

            <section class="page-header">
                <div>
                    <div class="eyebrow">Step 02</div>
                    <div class="page-title">机会分流决策</div>
                    <div class="page-description">三入口独立，关联可选。这里决定当前项目先走报价、标书还是合同，而不是把所有对象先硬绑成一个母记录。</div>
                </div>
                <div class="header-actions">
                    <a class="btn" href="./lead-intake.html">返回录入</a>
                    <a class="btn btn-primary" href="./quote-center.html">按当前建议进入报价</a>
                </div>
            </section>

            <section class="route-grid">
                <a class="route-card active" href="./quote-center.html">
                    <span class="route-lead">推荐主入口</span>
                    <div class="icon-chip">${appIcon("i-quote")}</div>
                    <h3>报价中心</h3>
                    <p>适用于客户直接询价、非招投标项目、内部测算和折扣审批。当前项目的主问题是先给出商务数字与交付条件。</p>
                    <div class="route-criteria">
                        <div class="route-criterion">先锁商务数字，再决定是否带入合同</div>
                        <div class="route-criterion">若交付日明确，后续进入倒排日程</div>
                        <div class="route-criterion">已满足当前询价型机会的最短路径</div>
                    </div>
                    <div class="route-footer"><span>适配度</span><strong>高</strong></div>
                </a>

                <a class="route-card" href="./tender-analysis.html">
                    <span class="route-lead">备选入口</span>
                    <div class="icon-chip">${appIcon("i-tender")}</div>
                    <h3>标书中心</h3>
                    <p>适用于已出现正式招标文件、需要资质对标、评分项梳理和封标计划的项目。目前项目尚未出现正式招标件。</p>
                    <div class="route-criteria">
                        <div class="route-criterion">需要完整招标文件后再切入</div>
                        <div class="route-criterion">进入后会自动联动资质与案例库</div>
                        <div class="route-criterion">适合正式投标阶段使用</div>
                    </div>
                    <div class="route-footer"><span>适配度</span><strong>中</strong></div>
                </a>

                <a class="route-card" href="./contract-center.html">
                    <span class="route-lead">联动入口</span>
                    <div class="icon-chip">${appIcon("i-contract")}</div>
                    <h3>合同中心</h3>
                    <p>适用于外部合同草拟、历史合同补录、续签模板。当前项目不该从合同起步，但报价确认后应该直接带入条款模板。</p>
                    <div class="route-criteria">
                        <div class="route-criterion">适合补录与续签型场景</div>
                        <div class="route-criterion">可从报价单带入付款和交付变量</div>
                        <div class="route-criterion">后续联动法务审核最顺畅</div>
                    </div>
                    <div class="route-footer"><span>适配度</span><strong>中</strong></div>
                </a>
            </section>

            <section class="split">
                <div class="card">
                    <div class="section-title">分流判断依据</div>
                    <table class="table">
                        <thead><tr><th>判断项</th><th>当前结果</th><th>影响</th></tr></thead>
                        <tbody>
                            <tr><td>是否存在正式招标文件</td><td>否</td><td>不需要先进入标书解析工作区</td></tr>
                            <tr><td>是否要求先给商务数字</td><td>是</td><td>报价入口优先级最高</td></tr>
                            <tr><td>是否同步合同诉求</td><td>是</td><td>报价确认后应联动合同模板</td></tr>
                            <tr><td>交付日期是否明确</td><td>待确认</td><td>影响后续日程分支选择</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="panel-stack">
                    <div class="card">
                        <div class="section-title">本次决策输出</div>
                        <div class="summary-list">
                            <div class="summary-row"><span class="key">主入口</span><strong>报价中心</strong></div>
                            <div class="summary-row"><span class="key">联动入口</span><strong>合同中心</strong></div>
                            <div class="summary-row"><span class="key">日程引擎触发点</span><strong>报价确认后</strong></div>
                            <div class="summary-row"><span class="key">当前负责人</span><strong>张一鸣</strong></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="section-title">继续推进</div>
                        <div class="list">
                            <a class="list-item-card" href="./quote-center.html"><div class="list-item-title">进入报价中心</div><div class="list-item-meta">完成条目测算、毛利判断和正式报价预览。</div></a>
                            <a class="list-item-card" href="./contract-center.html"><div class="list-item-title">保留合同联动</div><div class="list-item-meta">报价确认后直接生成合同底稿，不再二次录入条款。</div></a>
                        </div>
                    </div>
                </div>
            </section>
        `;

        document.body.innerHTML = pageShell({
            activeRail: "home",
            activePage: "opportunity-routing",
            topTitle: "机会分流",
            topMeta: "选择主入口与后续联动",
            topAction: '<a class="btn btn-primary" href="./quote-center.html">创建报价单</a>',
            content
        });
    </script>
</body>
</html>
